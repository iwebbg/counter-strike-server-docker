services:
  panel-proxy:
    profiles: ["panel"]
    build:
      context: .
      dockerfile: docker/nginx/prod/Dockerfile
    image: cs16-panel-nginx:prod
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Set PANEL_DOMAIN with ./docker/compose publish}
      PANEL_SSL_EMAIL: ${PANEL_SSL_EMAIL:?Set PANEL_SSL_EMAIL with ./docker/compose publish}
      PANEL_HTTPS_PORT: ${PANEL_HTTPS_PORT:-443}
    ports:
      - "${PANEL_PROXY_BIND_IP:-0.0.0.0}:${PANEL_HTTP_PORT:-80}:80/tcp"
      - "${PANEL_PROXY_BIND_IP:-0.0.0.0}:${PANEL_HTTPS_PORT:-443}:443/tcp"
    volumes:
      - panel_certbot_www:/var/www/certbot
      - panel_letsencrypt:/etc/letsencrypt
    depends_on:
      panel:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  panel_certbot_www:
  panel_letsencrypt:
