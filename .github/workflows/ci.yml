name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require develop as the source for main
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_BRANCH" == "main" ]]; then
            if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              echo "Pull requests into main must come from this repository's develop branch."
              exit 1
            fi
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/cs-control-service/package-lock.json
            frontend/cs-control/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend/cs-control-service
      - run: npm ci --prefix frontend/cs-control
      - run: npm run format:check
      - run: npm test --prefix backend/cs-control-service
      - run: npm run build --prefix frontend/cs-control
      - run: docker compose --project-directory . --file docker/compose.yaml --profile panel config --quiet

  rehlds-image:
    name: ReHLDS image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash -n docker/rehlds-smoke.sh docker/rehlds-lab.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: rehlds
          load: true
          tags: cs16-server-rehlds:ci
          cache-from: type=gha,scope=cs16-images
          cache-to: type=gha,mode=max,scope=cs16-images
      - run: docker run --rm --entrypoint /usr/local/bin/rehlds-smoke cs16-server-rehlds:ci /opt/hlds
