name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/cs-control-service/package-lock.json
            frontend/cs-control/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend/cs-control-service
      - run: npm ci --prefix frontend/cs-control
      - run: npm run format:check
      - run: npm test --prefix backend/cs-control-service
      - run: npm run build --prefix frontend/cs-control
      - run: docker compose --file docker/compose.yaml --profile panel config --quiet

  docker-e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.1
      - run: npm ci --prefix backend/cs-control-service
      - run: docker compose --file docker/compose.yaml build server
      - run: npm run test:e2e --prefix backend/cs-control-service
