name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/cs-control-service/package-lock.json
            frontend/cs-control/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend/cs-control-service
      - run: npm ci --prefix frontend/cs-control
      - run: npm run format:check
      - run: npm test --prefix backend/cs-control-service
      - run: npm run build --prefix frontend/cs-control
      - run: docker compose --project-directory . --file docker/compose.yaml --profile panel config --quiet

  docker-e2e:
    runs-on: ubuntu-latest
    needs: rehlds-image
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix backend/cs-control-service
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: rehlds
          load: true
          tags: cs16-server:local
          cache-from: type=gha,scope=cs16-images
          cache-to: type=gha,mode=max,scope=cs16-images
      - run: npm run test:e2e --prefix backend/cs-control-service

  rehlds-image:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash -n docker/rehlds-smoke.sh docker/rehlds-lab.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: rehlds
          load: true
          tags: cs16-server-rehlds:ci
          cache-from: type=gha,scope=cs16-images
          cache-to: type=gha,mode=max,scope=cs16-images
      - run: docker run --rm --entrypoint /usr/local/bin/rehlds-smoke cs16-server-rehlds:ci /opt/hlds
