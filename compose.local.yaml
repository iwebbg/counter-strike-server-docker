services:
  panel-proxy:
    profiles: ["panel"]
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8080}:80/tcp"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      panel:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
