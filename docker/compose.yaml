name: cs16

services:
  server:
    build:
      context: .
    image: cs16-server:local
    restart: unless-stopped
    environment:
      SERVER_MODE: ${SERVER_MODE:-classic}
      SERVER_NAME: ${SERVER_NAME:-My CS 1.6 Server}
      MAX_PLAYERS: ${MAX_PLAYERS:-24}
      START_MAP: ${START_MAP:-}
      MAPCYCLE: ${MAPCYCLE:-}
      RCON_PASSWORD: ${RCON_PASSWORD:-change-me-now}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      SV_LAN: ${SV_LAN:-0}
      REGION: ${REGION:-3}
      WELCOME_MESSAGE: ${WELCOME_MESSAGE:-Welcome to our CS 1.6 server!}
      AMXX_BRANDING_MESSAGE: ${AMXX_BRANDING_MESSAGE:-%hostname% is powered by CS 1.6 Server CP | interweb.bg}
      AMXX_BRANDING_INTERVAL: ${AMXX_BRANDING_INTERVAL:-600}
      AMXX_BRANDING_COLOR: ${AMXX_BRANDING_COLOR:-201255074}
      GG_DOUBLEJUMP_ENABLED: ${GG_DOUBLEJUMP_ENABLED:-1}
      GG_DOUBLEJUMP_VELOCITY: ${GG_DOUBLEJUMP_VELOCITY:-350.0}
      WARMUP_ENABLED: ${WARMUP_ENABLED:-1}
      WARMUP_SECONDS: ${WARMUP_SECONDS:-45}
      SPAWN_PROTECTION_ENABLED: ${SPAWN_PROTECTION_ENABLED:-}
      SPAWN_PROTECTION_SECONDS: ${SPAWN_PROTECTION_SECONDS:-3.0}
      SEMICLIP_ENABLED: ${SEMICLIP_ENABLED:-1}
      AFK_MANAGER_ENABLED: ${AFK_MANAGER_ENABLED:-1}
      AFK_WARN_SECONDS: ${AFK_WARN_SECONDS:-60}
      AFK_SPECTATOR_SECONDS: ${AFK_SPECTATOR_SECONDS:-90}
      AFK_KICK_SECONDS: ${AFK_KICK_SECONDS:-180}
      RTV_ENABLED: ${RTV_ENABLED:-1}
      RTV_RATIO: ${RTV_RATIO:-0.60}
      RTV_MIN_VOTES: ${RTV_MIN_VOTES:-2}
      RTV_DELAY_SECONDS: ${RTV_DELAY_SECONDS:-120}
      RECENT_MAPS: ${RECENT_MAPS:-3}
      KILLSTREAK_ENABLED: ${KILLSTREAK_ENABLED:-1}
      KILLSTREAK_SOUNDS_ENABLED: ${KILLSTREAK_SOUNDS_ENABLED:-1}
      KILLSTREAK_HUD_ENABLED: ${KILLSTREAK_HUD_ENABLED:-1}
      KILLSTREAK_GLOBAL: ${KILLSTREAK_GLOBAL:-1}
      KILLSTREAK_MULTI_WINDOW: ${KILLSTREAK_MULTI_WINDOW:-4.0}
      AMXX_ADMINS: ${AMXX_ADMINS:-}
      DB_ENABLED: ${DB_ENABLED:-0}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_NAME: ${DB_NAME:-cs16}
      DB_USER: ${DB_USER:-cs16}
      DB_PASSWORD: ${DB_PASSWORD:-change-db-password}
      SERVER_ID: ${SERVER_ID:-cs16-1}
    ports:
      - "${SERVER_PORT:-27015}:27015/udp"
      - "${SERVER_PORT:-27015}:27015/tcp"
    volumes:
      - cs16_logs:/opt/hlds/cstrike/logs
      - cs16_amxx_data:/opt/hlds/cstrike/addons/amxmodx/data
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x hlds_linux >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 30s
    labels:
      com.cs16.controlled: "true"
      com.cs16.managed-by: compose
      com.cs16.instance-id: primary
      com.cs16.display-name: ${SERVER_NAME:-My CS 1.6 Server}

  panel:
    profiles: ["panel"]
    build:
      context: .
      dockerfile: backend/cs-control-service/docker/prod/Dockerfile
    image: cs16-control-panel:local
    restart: unless-stopped
    # Docker socket GIDs differ between hosts; socket access is already
    # root-equivalent, so only the control-plane process runs as root.
    user: root
    environment:
      SERVICE_NAME: cs-control-service
      SERVICE_PORT: 8080
      PROCESS_ROLE: api
      SERVER_IMAGE: cs16-server:local
      PANEL_NETWORK: cs16_default
      PANEL_ALLOWED_NETWORKS: ${PANEL_ALLOWED_NETWORKS:-cs16_default}
      BACKUP_SCHEDULER_ENABLED: ${BACKUP_SCHEDULER_ENABLED:-1}
      BACKUP_SCHEDULER_INTERVAL_MS: ${BACKUP_SCHEDULER_INTERVAL_MS:-60000}
      BACKUP_REMOTE_URL: ${BACKUP_REMOTE_URL:-}
      BACKUP_REMOTE_TOKEN: ${BACKUP_REMOTE_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_TIMEOUT_MS: ${DISCORD_WEBHOOK_TIMEOUT_MS:-3000}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      MODERATION_RATE_LIMIT_WINDOW_MS: ${MODERATION_RATE_LIMIT_WINDOW_MS:-60000}
      MODERATION_RATE_LIMIT_MAX: ${MODERATION_RATE_LIMIT_MAX:-30}
      PANEL_ALLOWED_IPS: ${PANEL_ALLOWED_IPS:-}
      SSO_ENABLED: ${SSO_ENABLED:-0}
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:-}
      SSO_EMAIL_HEADER: ${SSO_EMAIL_HEADER:-x-auth-request-email}
      PORT_RANGE_START: ${PORT_RANGE_START:-27015}
      PORT_RANGE_END: ${PORT_RANGE_END:-27115}
      KILLSTREAK_ENABLED: ${KILLSTREAK_ENABLED:-1}
      KILLSTREAK_SOUNDS_ENABLED: ${KILLSTREAK_SOUNDS_ENABLED:-1}
      KILLSTREAK_HUD_ENABLED: ${KILLSTREAK_HUD_ENABLED:-1}
      KILLSTREAK_GLOBAL: ${KILLSTREAK_GLOBAL:-1}
      KILLSTREAK_MULTI_WINDOW: ${KILLSTREAK_MULTI_WINDOW:-4.0}
      AMXX_BRANDING_MESSAGE: ${AMXX_BRANDING_MESSAGE:-%hostname% is powered by CS 1.6 Server CP | interweb.bg}
      AMXX_BRANDING_INTERVAL: ${AMXX_BRANDING_INTERVAL:-600}
      AMXX_BRANDING_COLOR: ${AMXX_BRANDING_COLOR:-201255074}
      DB_ENABLED: ${DB_ENABLED:-0}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-cs16}
      DB_USER: ${DB_USER:-cs16}
      DB_PASSWORD: ${DB_PASSWORD:-change-db-password}
      DB_POOL_MIN: ${DB_POOL_MIN:-0}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      BOOTSTRAP_ADMIN_NAME: ${PANEL_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${PANEL_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-change-admin-password}
      REDIS_URL: redis://default:${REDIS_PASSWORD:-change-redis-password}@redis:6379
      REDIS_REQUIRED: "true"
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-cs_control_session}
      AUTH_ACCESS_TOKEN_LIFETIME: ${AUTH_ACCESS_TOKEN_LIFETIME:-3600}
      AUTH_REFRESH_TOKEN_LIFETIME: ${AUTH_REFRESH_TOKEN_LIFETIME:-1209600}
      AUTH_COOKIE_TTL_LIFETIME: ${AUTH_COOKIE_TTL_LIFETIME:-1209600}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-600}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-48mb}
      BACKUP_DIR: /backups
      DB_BACKUP_IMAGE: mariadb:11.8
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - panel_backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  panel-web:
    profiles: ["panel"]
    build:
      context: .
      dockerfile: frontend/docker/prod/Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: CS 1.6 Server CP
    image: cs16-control-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-cs_control_session}
      NEXT_PUBLIC_APP_NAME: CS 1.6 Server CP
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      panel:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  cs16_logs:
  cs16_amxx_data:
  panel_backups:
