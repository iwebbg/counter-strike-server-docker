services:
  server:
    environment:
      DB_ENABLED: "1"
    depends_on:
      mariadb:
        condition: service_healthy

  panel:
    environment:
      DB_ENABLED: "1"
      DB_HOST: ${DB_HOST:-mariadb}
      DB_NAME: ${DB_NAME:-cs16}
      DB_USER: ${DB_USER:-cs16}
      DB_PASSWORD: ${DB_PASSWORD:-change-db-password}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-cs16}
      MARIADB_USER: ${DB_USER:-cs16}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-db-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/cs-control-service/src/database/baseline.sql:/docker-entrypoint-initdb.d/010-cs16-baseline.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    profiles: ["panel"]
    image: redis:8.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-redis-password}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-redis-password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  redis_data:
