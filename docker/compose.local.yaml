services:
  panel:
    environment:
      AUTH_COOKIE_SECURE: "false"

  panel-web:
    build:
      context: .
      dockerfile: frontend/docker/develop/Dockerfile
    image: cs16-control-web:develop
    environment:
      NODE_ENV: development
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-cs_control_session}
      NEXT_PUBLIC_APP_NAME: CS 1.6 Server CP
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/cs-control/app:/usr/app/app
      - ./frontend/cs-control/components:/usr/app/components
      - ./frontend/cs-control/i18n:/usr/app/i18n
      - ./frontend/cs-control/lib:/usr/app/lib
      - ./frontend/cs-control/public:/usr/app/public
      - ./frontend/cs-control/proxy.ts:/usr/app/proxy.ts
    read_only: false

  panel-proxy:
    profiles: ["panel"]
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8080}:80/tcp"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      panel:
        condition: service_healthy
      panel-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
