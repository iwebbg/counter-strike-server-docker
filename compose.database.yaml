services:
  server:
    environment:
      DB_ENABLED: "1"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  panel:
    environment:
      DB_ENABLED: "1"
      DB_HOST: ${DB_HOST:-mariadb}
      DB_NAME: ${DB_NAME:-cs16}
      DB_USER: ${DB_USER:-cs16}
      DB_PASSWORD: ${DB_PASSWORD:-change-db-password}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-cs16}
      MARIADB_USER: ${DB_USER:-cs16}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-db-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-migrate:
    image: mariadb:11.8
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_PASSWORD:-change-db-password}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_NAME: ${DB_NAME:-cs16}
      DB_USER: ${DB_USER:-cs16}
    volumes:
      - ./database/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - mariadb --host="$${DB_HOST}" --user="$${DB_USER}" "$${DB_NAME}" < /schema.sql

volumes:
  mariadb_data:

